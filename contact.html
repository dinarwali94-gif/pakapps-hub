<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:0}
header{background:#1e293b;padding:20px;text-align:center}
header a{color:#fff;text-decoration:none;margin:0 10px}
.container{max-width:700px;margin:30px auto;padding:20px;background:#1e293b;border-radius:10px}
h1{color:#38bdf8;text-align:center}
label{display:block;margin-top:15px}
input,textarea{width:100%;padding:12px;margin-top:5px;border:none;border-radius:6px;box-sizing:border-box}
button{background:#38bdf8;color:#000;padding:12px 20px;border:none;border-radius:6px;font-weight:bold;margin-top:15px;width:100%;cursor:pointer}
.info{margin-top:20px;line-height:1.8;text-align:center}

footer a{color:#38bdf8;text-decoration:none}
</style>

<header>

</header>
<div class="container">
<h1>Contact Us</h1>
<p style="text-align:center">Have a question or want to submit your app? Send us a message.</p>
<form action="mailto:contact@pakapps-hub.vercel.app" method="post" enctype="text/plain">
<label>Your Name</label>
<input type="text" name="name" placeholder="Enter your name" required>
<label>Your Email</label>
<input type="email" name="email" placeholder="Enter your email" required>
<label>Your Message</label>
<textarea name="message" rows="5" placeholder="Write your message here..." required></textarea>
<button type="submit">Send Message</button>
</form>
<div class="info">
<p><b>Email:</b> contact@pakapps-hub.vercel.app</p>
<p><b>Website:</b> pakapps-hub.vercel.app</p>
</div>
</div>

</html>
